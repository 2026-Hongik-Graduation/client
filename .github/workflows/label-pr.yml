name: Label PR

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  label:
    name: Auto Label by PR Title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL_MAP = [
              { pattern: /^\[INIT\]/i,     name: '⚙ INIT',         color: 'eed893', description: '초기 세팅 작업' },
              { pattern: /^\[FEAT\]/i,     name: '✨ Feature',      color: 'a2eeef', description: '새로운 기능(기능성) 구현' },
              { pattern: /^\[FIX\]/i,      name: '🐛 FIX',          color: 'd73a4a', description: '기능이 정상적으로 작동되지 않는 문제 수정' },
              { pattern: /^\[DOCS\]/i,     name: '📝 Docs',         color: '0075ca', description: '문서 추가 및 수정' },
              { pattern: /^\[REFACTOR\]/i, name: '♻️ Refactor',     color: 'e4e669', description: '코드 리팩토링' },
              { pattern: /^\[DESIGN\]/i,   name: '🎨 Design',       color: 'f9a8d4', description: 'UI/UX 디자인 수정' },
              { pattern: /^\[TEST\]/i,     name: '🧪 Test',         color: 'bfd4f2', description: '테스트 코드 추가 및 수정' },
              { pattern: /^\[CI\]/i,       name: '👷 CI',           color: 'c5def5', description: 'CI/CD 설정 변경' },
              { pattern: /^\[PERF\]/i,     name: '⚡ Performance',  color: 'ff8c00', description: '성능 개선' },
              { pattern: /^\[CHORE\]/i,    name: '🔧 Chore',        color: 'd4c5f9', description: '빌드 및 기타 설정 변경' },
            ]

            const title = context.payload.pull_request.title
            const matched = LABEL_MAP.find(({ pattern }) => pattern.test(title))

            if (!matched) {
              console.log(`No matching label for title: "${title}"`)
              return
            }

            const { name, color, description } = matched

            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const exists = repoLabels.some(l => l.name === name)

            if (!exists) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color,
                description,
              })
              console.log(`Created label: ${name}`)
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [name],
            })

            console.log(`Applied label "${name}" to PR #${context.payload.pull_request.number}`)
